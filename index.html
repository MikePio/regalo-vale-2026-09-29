<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />
    <title>I nostri ricordi</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="carousel" id="carousel" aria-roledescription="carosello" aria-label="I nostri ricordi">
      <div class="carousel__slides">
        <figure class="slide is-active" aria-hidden="false">
          <img src="assets/images/1m.jpg" alt="Foto ricordo 1" fetchpriority="high" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/5.jpg" alt="Foto ricordo 5" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/2m.jpg" alt="Foto ricordo 2" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/3m.jpg" alt="Foto ricordo 3" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <video
            src="assets/images/8m.mp4"
            aria-label="Video ricordo"
            autoplay
            controls
            muted
            playsinline
            preload="metadata"
          ></video>
        </figure>        
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/4m.jpg" alt="Foto ricordo 4" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/5m.jpg" alt="Foto ricordo 6" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/6m.jpg" alt="Foto ricordo 7" loading="lazy" />
        </figure>
        <figure class="slide" aria-hidden="true">
          <img src="assets/images/7m.jpg" alt="Foto ricordo 8" loading="lazy" />
        </figure>
      </div>

      <button class="arrow arrow--previous" type="button" aria-label="Foto precedente">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5m0 0 7 7m-7-7 7-7" />
        </svg>
      </button>
      <button class="arrow arrow--next" type="button" aria-label="Foto successiva">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14m0 0-7-7m7 7-7 7" />
        </svg>
      </button>

      <div class="dots" role="group" aria-label="Seleziona una foto"></div>
    </main>
  </body>
</html>
